# Unbound configuration for running the resolver in Docker on Windows/macOS.
# Same policy as secure-gateway.conf (the Ubuntu config); only the listener
# and access control differ because traffic arrives through Docker's network.
#
# docker-compose.yml publishes this port ONLY on the host's loopback
# (127.0.0.1:5335), so the Python security layer is still the only thing on
# the network that can reach Unbound.
#
#   Test device -> Python security layer (Windows) :53 -> Unbound (Docker) 127.0.0.1:5335
#               -> trusted upstream (DNS-over-TLS) -> Internet

server:
    interface: 0.0.0.0
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes
    do-daemonize: no
    username: "unbound"
    directory: "/etc/unbound"
    pidfile: ""
    logfile: ""
    use-syslog: no

    # Queries reach the container from Docker's internal network (the host's
    # loopback port is forwarded in), so allow private ranges only.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 192.168.0.0/16 allow

    # DNSSEC validation (trust anchor fetched by unbound-anchor at startup)
    auto-trust-anchor-file: "/var/lib/unbound/root.key"

    # Hardening / privacy
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    qname-minimisation: yes
    aggressive-nsec: yes
    val-clean-additional: yes
    unwanted-reply-threshold: 10000

    # Performance / caching
    prefetch: yes
    prefetch-key: yes
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    cache-min-ttl: 60
    cache-max-ttl: 86400

    # Never return private addresses for public names (DNS-rebinding defense).
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    verbosity: 1
    log-queries: no

remote-control:
    control-enable: no

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
