# Unbound configuration for the Secure DNS Gateway (Section 4.2).
# Installed to /etc/unbound/unbound.conf.d/secure-gateway.conf by setup_ubuntu.sh.
#
# Unbound is the resolution engine only. It listens on loopback port 5335 so
# that ONLY the Python security layer (on port 53) can reach it; clients can
# never bypass inspection by talking to Unbound directly.
#
#   Test device -> Python security layer :53 -> Unbound 127.0.0.1:5335
#               -> trusted upstream (DNS-over-TLS) -> Internet
#
# DNSSEC validation is enabled by Ubuntu's root-auto-trust-anchor-file.conf
# that ships with the unbound package.

server:
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-ip6: no
    do-udp: yes
    do-tcp: yes

    # Access control: only the local security layer may query.
    access-control: 0.0.0.0/0 refuse
    access-control: 127.0.0.0/8 allow

    # Hardening / privacy
    hide-identity: yes
    hide-version: yes
    harden-glue: yes
    harden-dnssec-stripped: yes
    harden-referral-path: yes
    harden-algo-downgrade: yes
    use-caps-for-id: no
    qname-minimisation: yes
    aggressive-nsec: yes
    val-clean-additional: yes
    unwanted-reply-threshold: 10000

    # Performance / caching
    prefetch: yes
    prefetch-key: yes
    num-threads: 2
    msg-cache-size: 32m
    rrset-cache-size: 64m
    cache-min-ttl: 60
    cache-max-ttl: 86400
    so-reuseport: yes

    # Never return private addresses for public names (DNS-rebinding defense).
    private-address: 10.0.0.0/8
    private-address: 172.16.0.0/12
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: fd00::/8
    private-address: fe80::/10

    # CA bundle used to verify the DNS-over-TLS upstreams below.
    tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt

    verbosity: 1
    log-queries: no

# Forward everything to trusted upstream resolvers over DNS-over-TLS.
forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-addr: 1.1.1.1@853#cloudflare-dns.com
    forward-addr: 1.0.0.1@853#cloudflare-dns.com
    forward-addr: 9.9.9.9@853#dns.quad9.net
    forward-addr: 149.112.112.112@853#dns.quad9.net
